# GitHub Actions: ECR에 Docker 이미지 빌드 및 푸시 + ECS 배포
# 트리거: main 브랜치에 push 또는 수동 실행

name: Build and Deploy to ECS

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - ".gitignore"
      - ".claudeignore"
  workflow_dispatch: # 수동 실행 허용
    inputs:
      environment:
        description: "배포 환경"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  AWS_REGION: ap-northeast-2 # 서울 리전 (필요시 변경)
  ECR_REPOSITORY: backend-shakishaki-archive # ECR 리포지토리 이름
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }} # ECS 클러스터 이름 (Secrets에 설정)
  ECS_SERVICE: ${{ secrets.ECS_SERVICE_NAME }} # ECS 서비스 이름 (Secrets에 설정)

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # OIDC 토큰 발급을 위한 권한

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. AWS 자격증명 구성 (OIDC 사용 권장)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # OIDC 방식 (권장) - IAM Role 사용
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # Access Key 방식 (대안) - 아래 주석 해제하여 사용
          # aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # 3. Amazon ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Docker 메타데이터 설정 (태그, 라벨)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            # latest 태그 - ECS 서비스가 참조하는 태그
            type=raw,value=latest
            # Git SHA (short) - 커밋별 고유 태그 (롤백용)
            type=sha,prefix=,format=short

      # 5. Docker Buildx 설정 (멀티플랫폼 빌드 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Docker 이미지 빌드 및 ECR 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 빌드 플랫폼 (ARM64 추가 시 linux/arm64 추가)
          platforms: linux/amd64

      # 7. 빌드 결과 출력
      - name: Output image info
        run: |
          echo "### Docker Image Pushed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ env.ECR_REPOSITORY }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # 8. ECS 서비스 강제 재배포 (새 이미지 pull) 테스트
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          echo "### ECS Deployment Triggered!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ env.ECS_CLUSTER }}" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ env.ECS_SERVICE }}" >> $GITHUB_STEP_SUMMARY

      # 9. ECS 배포 완료 대기 (선택 - 배포 상태 확인)
      - name: Wait for ECS deployment
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}
          echo "### ECS Service Stabilized!" >> $GITHUB_STEP_SUMMARY
